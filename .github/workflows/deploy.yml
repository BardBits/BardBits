name: Deploy

# Deploys on every push to main. There is no stored AWS credential: the job
# presents a short-lived OIDC token, STS validates it against the trust policy
# in infra/github-oidc.yaml, and hands back credentials that expire in an hour.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the token itself, not just for AWS. id-token lets the job
# request the OIDC token; contents:read is all the checkout needs. Declaring
# these here overrides the repository default for this workflow.
permissions:
  id-token: write
  contents: read

# A second push while one deploy is mid-flight would race two syncs against the
# same bucket. Queue instead, and never cancel a run that may have already
# uploaded assets but not yet the HTML that references them.
concurrency:
  group: deploy-main
  cancel-in-progress: false

# The bucket name comes from a repository variable rather than being written
# here. Bucket names are globally unique, so this one was chosen before the
# domain was, and it has nothing to do with what the site is called - leaving it
# in the source invites someone to "fix" the mismatch, which is a migration
# rather than an edit. If SITE_BUCKET is missing the deploy fails at the first
# sync with an empty bucket name.
env:
  AWS_REGION: ca-central-1
  BUCKET: ${{ vars.SITE_BUCKET }}
  DISTRIBUTION_ID: E3RJMPASAQD8EC

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build all projects
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Confirm the assumed identity
        run: aws sts get-caller-identity

      # These steps are hand-maintained and projects.json does not drive them.
      # A project added to the manifest gets built, previewed, indexed and
      # smoke-tested without ever being uploaded, which is how /reversi/ shipped
      # 403ing behind a live landing-page card. Adding a project means adding a
      # step here. See the guard in ci.yml that now checks the two agree.
      #
      # Order matters. retreat-names prunes its prefix, so it goes first; the
      # hub restores the index.html that lives alongside it; site-root goes last
      # so the sitemap index reflects what the others just built. Projects that
      # own their prefix outright, like reversi, have no such constraint and
      # slot in anywhere before site-root.
      - name: Deploy retreat-names
        shell: pwsh
        run: ./scripts/deploy-project.ps1 -Project retreat-names -Bucket $env:BUCKET -DistributionId $env:DISTRIBUTION_ID -SkipBuild

      - name: Deploy name-generators-hub
        shell: pwsh
        run: ./scripts/deploy-project.ps1 -Project name-generators-hub -Bucket $env:BUCKET -DistributionId $env:DISTRIBUTION_ID -SkipBuild

      # boat-names mounts a level deeper, at name-generators/boat, so it shares
      # no prefix with either of the two above and needs no pruneScope: its
      # --delete is already bounded to its own subtree.
      - name: Deploy boat-names
        shell: pwsh
        run: ./scripts/deploy-project.ps1 -Project boat-names -Bucket $env:BUCKET -DistributionId $env:DISTRIBUTION_ID -SkipBuild

      - name: Deploy reversi
        shell: pwsh
        run: ./scripts/deploy-project.ps1 -Project reversi -Bucket $env:BUCKET -DistributionId $env:DISTRIBUTION_ID -SkipBuild

      - name: Deploy site-root
        shell: pwsh
        run: ./scripts/deploy-project.ps1 -Project site-root -Bucket $env:BUCKET -DistributionId $env:DISTRIBUTION_ID -SkipBuild

      # Proves the deploy actually reached the live domain rather than just
      # exiting zero. Fails the run if any page stops returning 200.
      #
      # Every page site-root publishes belongs in this list, not just the ones
      # with traffic. /about/ and /privacy/ were missing, so a deploy that broke
      # either would have gone green - and /privacy/ is the page whose absence
      # matters most, being the one the policy itself promises is there.
      - name: Smoke test the live site
        run: |
          set -e
          for path in / /about/ /privacy/ /name-generators/ /name-generators/cottage/ /name-generators/cabin/ /name-generators/beach/ /name-generators/boat/ /name-generators/boat/funny/ /name-generators/boat/nautical/ /name-generators/boat/sailboat/ /name-generators/boat/pontoon/ /name-generators/boat/fishing/ /name-generators/boat/favicon.svg /reversi/ /name-generators/favicon.svg /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 "https://bardbits.ca${path}")
            echo "${code}  ${path}"
            [ "$code" = "200" ] || exit 1
          done
